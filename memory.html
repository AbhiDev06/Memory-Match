<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Memory Match</title>
    <link rel="stylesheet" href="memory.css">
</head>

<body>
    <main class="game">
        <h1>Memory Match Game</h1>
        <p class="sub">Flip two cards at a time and find all the pairs.</p>

        <div class="levels" id="levels">
            <button data-level="easy" class="active">Easy</button>
            <button data-level="medium">Medium</button>
            <button data-level="hard">Hard</button>
        </div>

        <div class="stats">
            <div><small>Moves</small><b id="moves">0</b></div>
            <div><small>Time</small><b id="time">0:00</b></div>
            <div><small>Best</small><b id="best">-</b></div>
        </div>

        <div id="board" class="board" aria-label="Card board"></div>


        <div class="game-actions">
            <button id="hint" class="hint">Hint</button>
            <button id="restart" class="restart">New game</button>
        </div>

    </main>

    <div id="win" class="win" hidden>
        <div class="win-box" role="dialog" aria-modal="true">
            <h2>You won!</h2>
            <p id="winText"></p>
            <button id="playAgain" class="restart">Play again</button>
        </div>
    </div>

    <script src="memory.js"></script>
</body>

</html>
